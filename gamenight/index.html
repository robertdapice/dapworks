<!doctype html>

<head>

<meta name="description" content="Couch Clash: quick games to play together on one screen, with your phones as the gamepads.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Couch Clash</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; cursor: default; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  window.CC_NET = 'peer';
  window.CC_OTHER = {"key":"Digit3","label":"Three players? Press 3","url":"trio/"};
  (function () {   // phones, and anyone following a room link, get the gamepad
    var q = new URLSearchParams(location.search);
    if (!q.has('host') && (q.has('r') || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent))) location.replace('pad.html' + location.search);
  })();
</script>
